<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Blood Request</title>
</head>
<body>

    <h2>Create Blood Request</h2>

    <input id="hospital_id" type="number" placeholder="Hospital ID">
    <br><br>

    <input id="patient_name" type="text" placeholder="Patient Name">
    <br><br>

    <select id="blood_group">
        <option value="">Select Blood Group</option>
        <option value="A+">A+</option>
        <option value="A-">A-</option>
        <option value="B+">B+</option>
        <option value="B-">B-</option>
        <option value="AB+">AB+</option>
        <option value="AB-">AB-</option>
        <option value="O+">O+</option>
        <option value="O-">O-</option>
    </select>

    <br><br>

    <input id="quantity" type="number" min="1" placeholder="Quantity">
    <br><br>

    <select id="urgency">
        <option value="Routine">Routine</option>
        <option value="Urgent">Urgent</option>
    </select>

    <br><br>

    <select id="delivery_channel">
        <option value="SMS">SMS</option>
        <option value="Email">Email</option>
        <option value="Both">Both</option>
    </select>

    <br><br>

    <textarea
        id="additional_information"
        placeholder="Additional Information"
    ></textarea>

    <br><br>

    <button onclick="createRequest()">
        Submit Blood Request
    </button>

    <pre id="result"></pre>

    <script>
        async function createRequest() {

            const data = {
                hospital_id:
                    document.getElementById('hospital_id').value,

                patient_name:
                    document.getElementById('patient_name').value,

                blood_group:
                    document.getElementById('blood_group').value,

                quantity:
                    document.getElementById('quantity').value,

                urgency:
                    document.getElementById('urgency').value,

                delivery_channel:
                    document.getElementById('delivery_channel').value,

                additional_information:
                    document.getElementById('additional_information').value
            };

            const response = await fetch(
                'http://localhost/blood-network-api/api/blood-requests/create.php',
                {
                    method: 'POST',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                }
            );

            const result = await response.text();

            document.getElementById('result').textContent = result;
        }
    </script>

</body>
</html>
