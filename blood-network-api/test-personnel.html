<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Personnel</title>
</head>
<body>

    <h2>Create Personnel</h2>

    <input id="full_name" type="text" placeholder="Full Name">
    <br><br>

    <input id="email" type="email" placeholder="Email">
    <br><br>

    <input id="phone" type="text" placeholder="Phone Number">
    <br><br>

    <input id="password" type="password" placeholder="Password">
    <br><br>

    <input id="job_title" type="text" placeholder="Job Title">
    <br><br>

    <input id="staff_number" type="text" placeholder="Staff Number (optional)">
    <br><br>

    <h3>Permissions</h3>

    <label>
        <input type="checkbox" value="MANAGE_DONORS" class="permission">
        Manage Donors
    </label>
    <br>

    <label>
        <input type="checkbox" value="MANAGE_APPOINTMENTS" class="permission">
        Manage Appointments
    </label>
    <br>

    <label>
        <input type="checkbox" value="RECORD_DONATIONS" class="permission">
        Record Donations
    </label>
    <br>

    <label>
        <input type="checkbox" value="MANAGE_INVENTORY" class="permission">
        Manage Inventory
    </label>
    <br>

    <label>
        <input type="checkbox" value="PROCESS_BLOOD_REQUESTS" class="permission">
        Process Blood Requests
    </label>
    <br>

    <label>
        <input type="checkbox" value="SEND_NOTIFICATIONS" class="permission">
        Send Notifications
    </label>

    <br><br>

    <button onclick="createPersonnel()">
        Create Personnel
    </button>

    <pre id="result"></pre>

    <script>
        async function createPersonnel() {

            const selectedPermissions = [];

            document.querySelectorAll('.permission:checked')
                .forEach(function (checkbox) {
                    selectedPermissions.push(checkbox.value);
                });

            const data = {
                full_name: document.getElementById('full_name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                password: document.getElementById('password').value,
                job_title: document.getElementById('job_title').value,
                staff_number: document.getElementById('staff_number').value,
                permissions: selectedPermissions
            };

            try {

                const response = await fetch(
                    'http://localhost/blood-network-api/api/personnel/create.php',
                    {
                        method: 'POST',
                        credentials: 'include',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(data)
                    }
                );

                const result = await response.text();

                document.getElementById('result').textContent = result;

            } catch (error) {

                document.getElementById('result').textContent =
                    'Request failed: ' + error.message;
            }
        }
    </script>

</body>
</html>
