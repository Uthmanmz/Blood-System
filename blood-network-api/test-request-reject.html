<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reject Blood Request</title>
</head>
<body>

    <h2>Reject Blood Request</h2>

    <input
        id="request_id"
        type="number"
        placeholder="Request ID"
    >

    <br><br>

    <textarea
        id="reason"
        placeholder="Reason for rejection"
    ></textarea>

    <br><br>

    <button onclick="rejectRequest()">
        Reject Request
    </button>

    <pre id="result"></pre>

    <script>
        async function rejectRequest() {

            const requestId =
                document.getElementById('request_id').value;

            const reason =
                document.getElementById('reason').value;

            const response = await fetch(
                'http://localhost/blood-network-api/api/blood-requests/reject.php',
                {
                    method: 'POST',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        request_id: requestId,
                        reason: reason
                    })
                }
            );

            const result = await response.text();

            document.getElementById('result').textContent = result;
        }
    </script>

</body>
</html>
