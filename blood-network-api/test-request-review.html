<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Review Blood Request</title>
</head>
<body>

    <h2>Move Blood Request to Under Review</h2>

    <input
        id="request_id"
        type="number"
        placeholder="Request ID"
    >

    <br><br>

    <button onclick="reviewRequest()">
        Move to Under Review
    </button>

    <pre id="result"></pre>

    <script>
        async function reviewRequest() {

            const requestId =
                document.getElementById('request_id').value;

            const response = await fetch(
                'http://localhost/blood-network-api/api/blood-requests/review.php',
                {
                    method: 'POST',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        request_id: requestId
                    })
                }
            );

            const result = await response.text();

            document.getElementById('result').textContent = result;
        }
    </script>

</body>
</html>
