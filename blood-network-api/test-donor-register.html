<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register Donor</title>
</head>
<body>

    <h2>Register Donor</h2>

    <input id="full_name" type="text" placeholder="Full Name">
    <br><br>

    <input id="email" type="email" placeholder="Email">
    <br><br>

    <input id="phone" type="text" placeholder="Phone Number">
    <br><br>

    <input id="password" type="password" placeholder="Password">
    <br><br>

    <select id="gender">
        <option value="">Select Gender</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
    </select>
    <br><br>

    <input id="date_of_birth" type="date">
    <br><br>

    <select id="blood_group">
        <option value="">Select Blood Group</option>
        <option value="A+">A+</option>
        <option value="A-">A-</option>
        <option value="B+">B+</option>
        <option value="B-">B-</option>
        <option value="AB+">AB+</option>
        <option value="AB-">AB-</option>
        <option value="O+">O+</option>
        <option value="O-">O-</option>
    </select>
    <br><br>

    <input id="genotype" type="text" placeholder="Genotype">
    <br><br>

    <input id="address" type="text" placeholder="Address">
    <br><br>

    <input id="hospital_id" type="number" placeholder="Hospital ID">
    <br><br>

    <label>
        <input id="available_for_donation" type="checkbox" checked>
        Available for Donation
    </label>

    <br><br>

    <button onclick="registerDonor()">Register Donor</button>

    <pre id="result"></pre>

    <script>
        async function registerDonor() {

            const data = {
                full_name: document.getElementById('full_name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                password: document.getElementById('password').value,
                gender: document.getElementById('gender').value,
                date_of_birth: document.getElementById('date_of_birth').value,
                blood_group: document.getElementById('blood_group').value,
                genotype: document.getElementById('genotype').value,
                address: document.getElementById('address').value,
                hospital_id: document.getElementById('hospital_id').value,
                available_for_donation:
                    document.getElementById('available_for_donation').checked
            };

            const response = await fetch(
                'http://localhost/blood-network-api/api/donors/register.php',
                {
                    method: 'POST',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                }
            );

            const result = await response.text();

            document.getElementById('result').textContent = result;
        }
    </script>

</body>
</html>
