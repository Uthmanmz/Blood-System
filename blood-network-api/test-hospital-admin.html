<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Hospital Admin</title>
</head>
<body>

    <h2>Create Hospital Admin</h2>

    <input id="hospital_id" type="number" placeholder="Hospital ID">
    <br><br>

    <input id="full_name" type="text" placeholder="Full Name">
    <br><br>

    <input id="email" type="email" placeholder="Email">
    <br><br>

    <input id="phone" type="text" placeholder="Phone Number">
    <br><br>

    <input id="password" type="password" placeholder="Password">
    <br><br>

    <button onclick="createAdmin()">Create Hospital Admin</button>

    <pre id="result"></pre>

    <script>
        async function createAdmin() {

            const data = {
                hospital_id: document.getElementById('hospital_id').value,
                full_name: document.getElementById('full_name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                password: document.getElementById('password').value
            };

            try {
                const response = await fetch(
                    'http://localhost/blood-network-api/api/hospital-admins/create.php',
                    {
                        method: 'POST',
                        credentials: 'include',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(data)
                    }
                );

                const result = await response.text();

                document.getElementById('result').textContent = result;

            } catch (error) {
                document.getElementById('result').textContent =
                    'Request failed: ' + error.message;
            }
        }
    </script>

</body>
</html>
